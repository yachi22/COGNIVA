name: Cogniva CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-verification:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Production Webpack/Vite Bundle Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://cogniva-api.onrender.com/api/v1

  backend-verification:
    name: Backend Test Suite & Isolation Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run Test Suite & Cross-Tenant Denial Assertions
        run: pytest tests/
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-pipeline-only-not-for-production-use-32
          DATABASE_URL: ""
